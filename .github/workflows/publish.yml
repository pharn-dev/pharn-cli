name: publish

# Publish to npm when a GitHub Release is published, or on manual dispatch.
# Cut a release (tag vX.Y.Z, matching package.json "version") and this runs.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (Sigstore attestation via OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm ci
      # `npm publish` runs prepublishOnly (npm run check) + prepack (build) first,
      # so a failing gate blocks the release. `--provenance` overrides the
      # publishConfig `provenance: false` default: CI gets a signed attestation
      # (needs id-token: write + a CI OIDC provider) while local `npm publish`
      # still works without one.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
