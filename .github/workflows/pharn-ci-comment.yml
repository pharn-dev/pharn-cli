name: pharn-ci comment
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

# pharn-ci's sticky comment for FORK pull requests only. A PR from this
# repository is commented by the `pharn-ci comment` job in ci.yml, which reads
# the PR head the way the gating `Test` job does.
#
# This workflow runs from the default branch and never checks out a PR, so it
# is safe to grant pull-requests: write even though the Test job that feeds it
# ran on a fork PR's read-only token. The cost of that safety is pharn-ci's
# PR-number mode: the PR's file text is never read, so the comment reports test
# integrity (TI02/TI05, TEST_INTEGRITY_INDEX_UNAVAILABLE), the agent-config
# secret scan and dependency safety as not checked, and its verdict can
# disagree with the Test job's report. That report is the gate. See pharn-ci's
# README, "Fork PRs: comment from workflow_run".
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # The default branch: the trusted .pharn/ci.yml, never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pharn-ci-input
          path: ${{ runner.temp }}/pharn-ci-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # Keep digits only. The artifact is attacker-controlled: never put its text into a script.
      - id: pr
        env:
          PR_FILE: ${{ runner.temp }}/pharn-ci-input/pr-number
        run: echo "number=$(tr -dc '0-9' < "$PR_FILE" | head -c 10)" >> "$GITHUB_OUTPUT"
      - uses: pharn-dev/pharn-ci@38aca1f95b3f5e4bfa83ff08a98d0d3147869a90 # v0.10.0
        timeout-minutes: 5
        with:
          coverage-file: ${{ runner.temp }}/pharn-ci-input/coverage/lcov.info
          pr-number: ${{ steps.pr.outputs.number }}
          head-sha: ${{ github.event.workflow_run.head_sha }}
          test-integrity: block # the same mode as ci.yml, so the comment shows the same severities
          fail-on-verdict: false # the Test job in ci.yml already gates
