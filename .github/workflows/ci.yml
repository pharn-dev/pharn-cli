name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format check
        if: always()
        run: npm run format:check
      - name: Lint
        if: always()
        run: npm run lint
      - name: Markdown lint
        if: always()
        run: npm run lint:md
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Test
        if: always()
        run: npm run test:coverage
