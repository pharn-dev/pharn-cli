name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install
        id: install
        run: npm ci
      # Run each gate independently so one failure can't mask the others, but skip
      # them cleanly if install failed — no cascade of misleading "deps missing" errors.
      - name: Format check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Markdown lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint:md
      - name: Typecheck
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Test
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run test:coverage
      - name: Build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build
