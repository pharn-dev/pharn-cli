name: ci

# One job per gate, one status check per job.
#
# GitHub reports an Actions job under its `name:`, and that string is what the
# `main` branch ruleset lists in `required_status_checks` (the same convention
# `codeql.yml` relies on for `Analyze (javascript-typescript)`). So the six
# `name:` values below are a CONTRACT with the ruleset, not decoration —
# renaming one makes a required check unreportable and blocks every PR until the
# ruleset is edited to match. `tests/ci-workflow.test.ts` pins them.
#
# Why six jobs rather than six steps in one job: each gate then passes or fails
# on its own status check, so one red gate can neither mask nor be masked by
# another. That is what the previous single `check` job used `if: always()` step
# guards to approximate.
#
# Coverage is deliberately one platform, one Node version (see
# `.dev/features/ci-matrix-required-checks/PLAN.md`). Note that `package.json`
# declares `engines.node: ">=20"` while these gates run node 24 — the lower end
# of that published range is NOT exercised here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Markdown lint
        run: npm run lint:md

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      # Execute what the build just produced. Nothing else in this repo runs
      # `dist/index.js` — the vitest suite imports `src/`, and the one test that
      # spawns a process spawns tsx against `src/` too — so the BUNDLE's two
      # load-time assumptions shipped unexercised: `src/version.ts`'s
      # `createRequire` + `require('../package.json')`, correct only because the
      # bundle sits at the same depth below the package root as `src/version.ts`,
      # and the three dependency names `scripts/build.mjs` leaves `external`, i.e.
      # as bare imports Node must resolve at runtime. Both are resolved while the
      # module graph LOADS, before a flag is parsed, so either drift exits
      # non-zero here instead of reaching users as ERR_MODULE_NOT_FOUND.
      #
      # Narrowly, and worth stating so it is not read as more: this catches an
      # EXTERNALIZED package that no longer resolves or loads. One missing FROM
      # `external` is not this step's to catch — esbuild bundles it instead, and
      # an unresolvable one already fails `npm run build` one step earlier. And a
      # green Build never means "the CLI works": both flags return from `main()`
      # without dispatching a command, so no command, network call, or filesystem
      # write is exercised.
      #
      # It must stay a STEP in this job. `dist/` does not survive into another
      # job, and a seventh job would report a status check the `main` ruleset
      # does not require — see this file's header on why that contract is
      # load-bearing. `tests/ci-workflow.test.ts` pins the command and its order.
      - name: Smoke the built bundle
        run: node dist/index.js --version && node dist/index.js --help
