name: ci

# One job per gate, one status check per job.
#
# GitHub reports an Actions job under its `name:`, and that string is what the
# `main` branch ruleset lists in `required_status_checks` (the same convention
# `codeql.yml` relies on for `Analyze (javascript-typescript)`). So the six
# `name:` values below are a CONTRACT with the ruleset, not decoration —
# renaming one makes a required check unreportable and blocks every PR until the
# ruleset is edited to match. `tests/ci-workflow.test.ts` pins them.
#
# Why six jobs rather than six steps in one job: each gate then passes or fails
# on its own status check, so one red gate can neither mask nor be masked by
# another. That is what the previous single `check` job used `if: always()` step
# guards to approximate.
#
# Coverage is deliberately one platform, one Node version (see
# `.dev/features/ci-matrix-required-checks/PLAN.md`). Note that `package.json`
# declares `engines.node: ">=24.2.0"` while these gates run the latest node 24 —
# the lower end of that published range is exercised only by the separate,
# non-required `Smoke (node floor)` job in `node-floor.yml`, never by these gates.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Markdown lint
        run: npm run lint:md

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    # pharn-ci reads the PR's labels (the pharn/accepted sign-off) in
    # test-integrity: block; a job-level block replaces the workflow-level one.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pharn-ci diffs against the PR base locally; a shallow checkout
          # falls back to the API and can end in DIFF_UNAVAILABLE.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test:coverage
      # pharn-ci diff-coverage gate. comment: false — this job runs `npm ci` and
      # the test suite, so it holds no write grant. The sticky comment is posted
      # by the `pharn-ci comment` job below (same-repo PRs) or by
      # pharn-ci-comment.yml (fork PRs), both fed by the artifact this job
      # uploads. This step still gates on the threshold.
      - id: pharn-ci
        if: github.event_name == 'pull_request'
        uses: pharn-dev/pharn-ci@38aca1f95b3f5e4bfa83ff08a98d0d3147869a90 # v0.10.0
        timeout-minutes: 5
        with:
          comment: false
          # A weakened test (deleted, skipped, focused, or a loosened script, workflow or config) fails the check;
          # a reviewer who is not the PR author signs it off with the pharn/accepted label.
          test-integrity: block
      - if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number
      - if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pharn-ci-input
          path: |
            coverage/lcov.info
            pr-number
      # report.json for pharn-ci-explain and pharn-ci-cover: the comment cuts long lists.
      - if: always() && steps.pharn-ci.outputs.report-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pharn-ci-report
          path: ${{ steps.pharn-ci.outputs.report-path }}

  # pharn-ci's sticky PR comment for a pull request from THIS repository.
  #
  # It measures the PR as the `Test` job's pharn-ci step did: the same checkout
  # (the PR merge commit, fetch-depth 0), the same coverage file at the same
  # path (restored from the artifact `Test` uploaded in this run), the same
  # `.pharn/ci.yml`, and the same inputs except `comment` and `fail-on-verdict`.
  # So its verdict is computed from the gate's inputs. `tests/ci-workflow.test.ts`
  # pins that the two steps' `with:` maps differ in exactly those two keys.
  #
  # Why a separate job: it is the only job here with a write grant
  # (`pull-requests: write`), and it runs NO repository code (no `run:` step, no
  # setup-node, no npm), so no dependency or test code executes next to the
  # write token. `Test`, which runs `npm ci` and the suite, stays read-only.
  #
  # Why not pharn-ci-comment.yml (workflow_run) for every PR: pharn-ci's
  # PR-number mode never reads the PR's file text, so it reports test integrity
  # (TI02/TI05), the agent-config secret scan and dependency safety as not
  # checked, and its verdict disagrees with the gate. That workflow now runs
  # for fork PRs only, where this job's token would be read-only.
  #
  # Not a required check: the `main` ruleset does not list it, and it never
  # gates (fail-on-verdict: false). It runs whether `Test` passed or failed.
  # When `Test` failed before its pharn-ci step there is no gating report to
  # agree with, and `Test` is red anyway. On a Dependabot PR the token is
  # read-only unless a permissions block raises it, as the one below is meant
  # to (not yet seen on a Dependabot PR here). If it is not raised, pharn-ci
  # warns and keeps the report in the job summary instead of failing the step.
  pharn-ci-comment:
    name: pharn-ci comment
    needs: test
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Into the workspace, so coverage/lcov.info lands where .pharn/ci.yml
      # points, as in `Test`. The artifact's pr-number file lands untracked at
      # the root; pharn-ci lists files with git ls-files, so it is never read.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pharn-ci-input
      - uses: pharn-dev/pharn-ci@38aca1f95b3f5e4bfa83ff08a98d0d3147869a90 # v0.10.0
        timeout-minutes: 5
        with:
          comment: true
          test-integrity: block
          fail-on-verdict: false # the Test job gates

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      # Execute what the build just produced. The vitest suite imports `src/`;
      # only `tests/dist-smoke.test.ts` runs a bundle, one it builds into a temp
      # dir with this same script (so `Test` sees bundle-only regressions too),
      # never THIS `dist/index.js`. Without these runs the BUNDLE's two
      # load-time assumptions would ship unexercised here: `src/version.ts`'s
      # `createRequire` + `require('../package.json')`, correct only because the
      # bundle sits at the same depth below the package root as `src/version.ts`,
      # and the three dependency names `scripts/build.mjs` leaves `external`, i.e.
      # as bare imports Node must resolve at runtime. Both are resolved while the
      # module graph LOADS, before a flag is parsed, so either drift exits
      # non-zero here instead of reaching users as ERR_MODULE_NOT_FOUND.
      #
      # Narrowly, and worth stating so it is not read as more: this catches an
      # EXTERNALIZED package that no longer resolves or loads. One missing FROM
      # `external` is not this step's to catch — esbuild bundles it instead, and
      # an unresolvable one already fails `npm run build` one step earlier. And a
      # green Build never means "the CLI works": both flags return from `main()`
      # without dispatching a command, so no command, network call, or filesystem
      # write is exercised.
      #
      # It must stay a STEP in this job. `dist/` does not survive into another
      # job, and a seventh job would report a status check the `main` ruleset
      # does not require — see this file's header on why that contract is
      # load-bearing. `tests/ci-workflow.test.ts` pins the command and its order.
      - name: Smoke the built bundle
        run: node dist/index.js --version && node dist/index.js --help
