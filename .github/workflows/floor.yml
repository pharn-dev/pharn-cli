name: floor

# Runs the deterministic floor (P0) on every PR and on push to main.
# Uses `pull_request` (NOT pull_request_target) and grants no write and no
# secrets: a fork PR's untrusted markdown (threat B surface #6/#7) can never
# exfiltrate anything or mutate the repo from here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Unit tests (hook + floor)
        # Explicit globs (mirrors `npm test`): bare `node --test` skips the
        # dot-directory, which would silently drop the write-guard hook test.
        run: node --test "**/*.test.mjs" "**/*.test.cjs" ".claude/**/*.test.cjs" ".claude/**/*.test.mjs" ".dev/**/*.test.cjs" ".dev/**/*.test.mjs"
      - name: Validate floor
        run: node .dev/floor/validate.mjs .
