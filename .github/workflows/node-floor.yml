name: node-floor

# Starts the PACKED CLI on exactly the Node version `engines.node` declares as
# its floor. `package.json` once said ">=20" while @clack/prompts — a runtime
# dependency — needs 20.12.0 (it imports `styleText` from node:util), so on
# 20.0–20.11 even `pharn --version` died at load time and nothing caught it:
# the six gates in ci.yml run node 24 only.
#
# A SEPARATE workflow on purpose. ci.yml's six job names are a contract with the
# `main` branch ruleset (tests/ci-workflow.test.ts); matrixing one of them would
# rename its reported context and block every PR. This job's context
# (`Smoke (node 20.12.0)`) is additional and NOT required unless a maintainer
# adds it to the ruleset. Keep FLOOR below equal to package.json's lower bound
# (tests/engines.test.ts pins that bound against the runtime dependencies).
#
# Build on node 24 (the toolchain's own floor is higher), then install the
# tarball — runtime dependencies are external to the bundle (scripts/build.mjs),
# so only an install exercises what a user actually runs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-node-floor:
    name: Smoke (node 20.12.0)
    runs-on: ubuntu-latest
    env:
      FLOOR: 20.12.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.FLOOR }}
      - name: Install the packed CLI on the floor Node
        working-directory: ${{ runner.temp }}
        run: |
          node --version
          mkdir smoke && cd smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../pharn-dev-pharn-*.tgz
      - name: Start it
        working-directory: ${{ runner.temp }}/smoke
        run: |
          ./node_modules/.bin/pharn --version
          ./node_modules/.bin/pharn --help
